name: Bell engineering checks

on:
  push:
    branches: [the-thirteenth-bell]
  pull_request:
    branches: [the-thirteenth-bell]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bell-checks:
    name: bell-checks
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/the-thirteenth-bell'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Verify rules and build failure contracts
        run: node --test tests/*.test.cjs
      - name: Validate split source and isolated builds
        run: python3 tests/check_static.py
      - name: Verify complete-inventory failure contracts
        run: python3 -B -m unittest discover -s tests -p 'test_reproducible.py' -v
      - name: Compare complete portable build inventories
        run: python3 tests/check_reproducible.py --source-sha "$GITHUB_SHA" --report "$RUNNER_TEMP/bell-build-inventory.json"
      - name: Confirm checks leave the checkout clean
        run: |
          test ! -e dist
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Record build identity in the job summary
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'bell-build-inventory.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Bell build identity\n\nTwo isolated builds have identical complete inventories.\n\n```json\n')
              summary.write(json.dumps(report, indent=2))
              summary.write('\n```\n\nAutomated engineering checks only; no game deployment or human release approval.\n')
          PY
