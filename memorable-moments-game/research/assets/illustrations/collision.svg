<text x="30" y="270" class="sub">First pilot: measure closeness gain with one passive player vs two active. The plan must name which side gives —</text>
<text x="30" y="292" class="sub">narrow to motivated pairs + gift acquisition, or prove passivity-tolerant bonding. Until then, neither "kills async" nor "survives passivity" is settled.</text></svg>