<rect x="670" y="90" width="300" height="130" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/><text x="820.0" y="116" text-anchor="middle" class="nodet">Finding #6</text><text x="820.0" y="136" text-anchor="middle" class="noded">loop must complete with</text><text x="820.0" y="152" text-anchor="middle" class="noded">a passive partner</text><text x="820.0" y="168" text-anchor="middle" class="noded">top killer [SECONDARY]</text>
