<rect x="360" y="90" width="280" height="120" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="500.0" y="116" text-anchor="middle" class="nodet">Shared trophy case</text><text x="500.0" y="136" text-anchor="middle" class="noded">Between proved it</text><text x="500.0" y="152" text-anchor="middle" class="noded">35M claimed</text>
<text x="500" y="228" text-anchor="middle" class="tag" fill="#4f46e5">PROVEN</text>
<rect x="690" y="90" width="280" height="120" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="830.0" y="116" text-anchor="middle" class="nodet">Real stake mechanic</text><text x="830.0" y="136" text-anchor="middle" class="noded">limited rounds / timer</text><text x="830.0" y="152" text-anchor="middle" class="noded">forfeit — unrepeatable</text>
