<rect x="300" y="285" width="400" height="70" rx="12" fill="#4f46e5"/>
<text x="500" y="313" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">The design opening</text>
<text x="500" y="336" text-anchor="middle" font-size="12" fill="#e0e7ff">reveal + trophy case + stake, in one digital loop</text></svg>