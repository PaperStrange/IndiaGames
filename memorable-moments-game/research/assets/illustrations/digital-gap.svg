<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><rect width="1000" height="400" fill="#fafaf8" rx="16"/><style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
