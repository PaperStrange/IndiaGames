<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850"><rect width="720" height="850" fill="#f5f0e3"/><rect x="22" y="22" width="676" height="806" rx="12" fill="none" stroke="#cfc8b4"/><circle cx="630" cy="98" r="28" fill="#da906b"/><text x="60" y="90" fill="#263c34" font-family="Georgia,serif" font-size="15">SMALL HOURS  /  MEMORABLE MOMENTS</text><text x="60" y="180" fill="#263c34" font-family="Georgia,serif" font-size="40">Our museum of ordinary</text><text x="60" y="228" fill="#263c34" font-family="Georgia,serif" font-size="40">wonders</text><path d="M60 285h600" stroke="#cfc8b4"/><text x="60" y="340" fill="#8b604e" font-family="Georgia,serif" font-size="13">PERSON A</text><text x="60" y="380" fill="#263c34" font-family="Georgia,serif" font-size="24">A teaspoon and a sock became a</text><text x="60" y="412" fill="#263c34" font-family="Georgia,serif" font-size="24">lighthouse for ants.</text><text x="60" y="520" fill="#8b604e" font-family="Georgia,serif" font-size="13">PERSON B</text><text x="60" y="560" fill="#263c34" font-family="Georgia,serif" font-size="24">We named the keeper Fern. She only</text><text x="60" y="592" fill="#263c34" font-family="Georgia,serif" font-size="24">works at dusk.</text><path d="M60 720h600" stroke="#cfc8b4"/><text x="60" y="761" fill="#263c34" font-family="Georgia,serif" font-size="13">TWO OBJECTS · ONE NEW STORY</text><text x="60" y="793" fill="#263c34" font-family="Georgia,serif" font-size="13">October 5, 2026 · MADE TOGETHER</text></svg>